<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1A2030"/>
      <stop offset="1" stop-color="#090C13"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2BF0C8"/>
      <stop offset="1" stop-color="#3D7BFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2BF0C8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3D7BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="225" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="6"/>

  <!-- soft glow behind the mark -->
  <circle cx="512" cy="512" r="300" fill="url(#glow)"/>

  <!-- capture-frame brackets -->
  <g fill="none" stroke="#E9EEF7" stroke-width="56" stroke-linecap="round" stroke-linejoin="round">
    <path d="M214 354 V268 Q214 214 268 214 H354"/>
    <path d="M670 214 H756 Q810 214 810 268 V354"/>
    <path d="M810 670 V756 Q810 810 756 810 H670"/>
    <path d="M354 810 H268 Q214 810 214 756 V670"/>
  </g>

  <!-- recording ring (timer arc) + core -->
  <circle cx="512" cy="512" r="176" fill="none" stroke="url(#accent)" stroke-width="30" stroke-linecap="round"
          stroke-dasharray="830 276" transform="rotate(-90 512 512)"/>
  <circle cx="512" cy="512" r="112" fill="url(#accent)"/>
</svg>
